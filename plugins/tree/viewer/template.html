<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session tree</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #656d76; --border: #d8dee4;
    --root: #2f5bd3; --returned: #1a7f37; --open: #8c959f; --draft: #bf8700; --accent: #2f5bd3;
    --code-bg: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e6e8eb; --muted: #9aa4ae; --border: #2c323b;
      --root: #6b8cff; --returned: #3fb950; --open: #6e7781; --draft: #d29922; --accent: #6b8cff;
      --code-bg: #20242c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  a { color: var(--accent); }
  header .meta { color: var(--muted); font-size: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  select, input[type=search], button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 420px; height: calc(100% - 53px); }
  #graph { position: relative; min-width: 0; }
  #graph-svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; }
  #graph-svg text { font-family: inherit; pointer-events: none; }
  .legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); border: 1px dashed transparent; }
  .legend .draft::before { background: transparent; border-color: var(--draft); }
  .legend .line::before { width: 18px; height: 0; border-radius: 0; border-top: 2px dashed var(--returned); background: none; }
  .hint { position: absolute; right: 12px; bottom: 12px; font-size: 12px; color: var(--muted); }
  aside { border-left: 1px solid var(--border); background: var(--panel); overflow: auto; padding: 16px 18px; }
  aside h2 { margin: 0 0 4px; font-size: 18px; }
  aside h3 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; color: #fff; background: var(--c); margin-right: 6px; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .doc { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--bg); overflow-wrap: anywhere; }
  .doc h1, .doc h2, .doc h3, .doc h4 { font-size: 14px; margin: 10px 0 4px; text-transform: none; letter-spacing: 0; color: var(--text); }
  .doc p { margin: 6px 0; }
  .doc ul, .doc ol { margin: 6px 0; padding-left: 20px; }
  .doc code { background: var(--code-bg); padding: 0 4px; border-radius: 4px; font-size: 12px; }
  .doc pre { background: var(--code-bg); padding: 8px; border-radius: 6px; overflow: auto; font-size: 12px; }
  .doc pre code { background: none; padding: 0; }
  .empty { color: var(--muted); font-style: italic; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .dev { font-size: 12px; color: var(--muted); }
  .placeholder { color: var(--muted); margin-top: 40px; text-align: center; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 60% 40%; } aside { border-left: 0; border-top: 1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <h1>Session tree</h1>
  <span class="meta" id="meta"></span>
  <div class="controls">
    <label>Project <select id="project"></select></label>
    <label>Show <select id="state">
      <option value="all">All forks</option>
      <option value="returned">Returned</option>
      <option value="not-returned">Not returned</option>
      <option value="draft">Drafts</option>
    </select></label>
    <input type="search" id="search" placeholder="Search topics and results">
    <button id="fit" title="Fit the graph to the window">Fit</button>
  </div>
</header>
<main>
  <section id="graph">
    <svg id="graph-svg" role="img" aria-label="Tree of conversations and their forks"></svg>
    <div class="legend">
      <span style="--c: var(--root)">Main conversation</span>
      <span style="--c: var(--returned)">Fork returned</span>
      <span style="--c: var(--open)">Fork not returned</span>
      <span class="draft">Draft, not started</span>
      <span class="line">Result sent back</span>
    </div>
    <div class="hint">Click a box for details. Double-click to fold its branch. Reload the page for the latest state.</div>
  </section>
  <aside id="details"><p class="placeholder">Select a conversation or fork to see its brief and result.</p></aside>
</main>

<script>
const DATA = "__SESSION_TREE_DATA__";

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const formatDate = (iso) => (iso ? new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "");
const STATE_TEXT = { returned: "Returned", "not-returned": "Not returned", draft: "Draft" };
const STATE_COLOR = { returned: "--returned", "not-returned": "--open", draft: "--draft" };

function inline(text) {
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
}

/** A small Markdown subset: headings, lists, code blocks, bold, italics and inline code. All text is escaped. */
function markdown(source) {
  const lines = String(source || "").replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let list = null;
  let paragraph = [];
  const flush = () => {
    if (paragraph.length) { out.push(`<p>${inline(paragraph.join(" "))}</p>`); paragraph = []; }
    if (list) { out.push(`</${list}>`); list = null; }
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("```")) {
      flush();
      const code = [];
      while (++i < lines.length && !lines[i].startsWith("```")) code.push(lines[i]);
      out.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
      continue;
    }
    const heading = /^(#{1,4})\s+(.*)$/.exec(line);
    const bullet = /^\s*[-*]\s+(.*)$/.exec(line);
    const numbered = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (heading) { flush(); out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`); }
    else if (bullet || numbered) {
      if (paragraph.length) { out.push(`<p>${inline(paragraph.join(" "))}</p>`); paragraph = []; }
      const kind = bullet ? "ul" : "ol";
      if (list !== kind) { if (list) out.push(`</${list}>`); out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${inline((bullet || numbered)[1])}</li>`);
    } else if (!line.trim()) flush();
    else { if (list) { out.push(`</${list}>`); list = null; } paragraph.push(line.trim()); }
  }
  flush();
  return out.join("\n");
}

const nodesById = new Map(DATA.nodes.map((node) => [node.id, node]));
const parentOf = new Map(DATA.edges.filter((edge) => edge.kind === "fork").map((edge) => [edge.target, edge.source]));
const rootOf = (id) => { let current = id; while (parentOf.has(current)) current = parentOf.get(current); return current; };
const projectName = (cwd) => (cwd ? cwd.split("/").filter(Boolean).pop() : "Unknown project");

function displayLabel(node) {
  if (!node.fork) return node.title;
  return node.fork.topic;
}

const SVGNS = "http://www.w3.org/2000/svg";
const NODE_W = 200, NODE_H = 60, GAP_X = 34, GAP_Y = 90, RETURN_OFFSET = 40;
const svg = document.getElementById("graph-svg");
const make = (name, attrs, parent) => {
  const node = document.createElementNS(SVGNS, name);
  for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
  if (parent) parent.appendChild(node);
  return node;
};
const viewport = make("g", {}, svg);
let view = { x: 0, y: 0, k: 1 };
const applyView = () => viewport.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);

const childrenOf = new Map();
const forkEdges = DATA.edges.filter((edge) => edge.kind === "fork");
for (const edge of forkEdges) {
  if (!childrenOf.has(edge.source)) childrenOf.set(edge.source, []);
  childrenOf.get(edge.source).push(edge.target);
}
const folded = new Set();
let selected = null;
let positions = new Map();
const rects = new Map();

function currentRoots() {
  const project = document.getElementById("project").value;
  return DATA.nodes.filter((node) => !parentOf.has(node.id) && (!project || (node.cwd || "") === project)).map((node) => node.id);
}

function isDimmed(node) {
  if (!node.fork) return false;
  const state = document.getElementById("state").value;
  const query = document.getElementById("search").value.trim().toLowerCase();
  const text = `${node.title} ${node.fork.topic} ${node.fork.brief || ""} ${node.fork.result || ""}`.toLowerCase();
  return (state !== "all" && node.fork.state !== state) || (query !== "" && !text.includes(query));
}

const bezier = (a, b, c, d, t) => { const u = 1 - t; return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d; };

function edgeLabel(parent, x, y, text, anchor) {
  const group = make("g", {}, parent);
  const label = make("text", { x, y: y + 3.5, "text-anchor": anchor, "font-size": 10.5, fill: css("--muted") }, group);
  label.textContent = text;
  const box = label.getBBox();
  group.insertBefore(make("rect", { x: box.x - 3, y: box.y - 1, width: box.width + 6, height: box.height + 2, rx: 3, fill: css("--bg") }), label);
  return group;
}

// The outline shows the selected box. It is restyled in place: replacing the boxes during a click makes the browser drop the click.
function paintSelection() {
  for (const [id, rect] of rects) {
    const draft = nodesById.get(id).fork?.state === "draft";
    const isSelected = id === selected;
    rect.setAttribute("stroke", isSelected ? css("--text") : draft ? css("--draft") : "none");
    rect.setAttribute("stroke-width", isSelected ? 3 : 2);
    rect.setAttribute("stroke-dasharray", draft && !isSelected ? "6 4" : "none");
  }
}

function draw() {
  rects.clear();
  viewport.replaceChildren();
  svg.querySelectorAll("defs").forEach((defs) => defs.remove());
  const defs = make("defs", {}, svg);
  for (const [id, color] of [["arrow-fork", css("--muted")], ["arrow-return", css("--returned")]]) {
    const marker = make("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
    make("path", { d: "M0,0 L10,5 L0,10 z", fill: color }, marker);
  }
  const edgeLayer = make("g", {}, viewport);
  const nodeLayer = make("g", {}, viewport);
  const top = (p) => p.cy - NODE_H / 2;
  const bottom = (p) => p.cy + NODE_H / 2;

  for (const edge of DATA.edges) {
    if (!positions.has(edge.source) || !positions.has(edge.target)) continue;
    const dimmed = isDimmed(nodesById.get(edge.kind === "fork" ? edge.target : edge.source));
    const group = make("g", { opacity: dimmed ? 0.25 : 1 }, edgeLayer);
    if (edge.kind === "fork") {
      const p = positions.get(edge.source), c = positions.get(edge.target);
      const y1 = bottom(p), y2 = top(c), m = (y2 - y1) / 2;
      make("path", { d: `M${p.cx},${y1} C${p.cx},${y1 + m} ${c.cx},${y2 - m} ${c.cx},${y2}`, fill: "none", stroke: css("--muted"), "stroke-width": 1.5, "marker-end": "url(#arrow-fork)" }, group);
      edgeLabel(group, bezier(p.cx, p.cx, c.cx, c.cx, 0.72), bezier(y1, y1 + m, y2 - m, y2, 0.72), edge.label, "middle");
    } else {
      const c = positions.get(edge.source), p = positions.get(edge.target);
      const x1 = c.cx - RETURN_OFFSET, y1 = top(c), x2 = p.cx - RETURN_OFFSET, y2 = bottom(p), m = (y1 - y2) / 2;
      make("path", { d: `M${x1},${y1} C${x1},${y1 - m} ${x2},${y2 + m} ${x2},${y2}`, fill: "none", stroke: css("--returned"), "stroke-width": 2, "stroke-dasharray": "6 5", "marker-end": "url(#arrow-return)" }, group);
      edgeLabel(group, bezier(x1, x1, x2, x2, 0.3) - 6, bezier(y1, y1 - m, y2 + m, y2, 0.3), edge.label, "end");
    }
  }

  for (const [id, p] of positions) {
    const node = nodesById.get(id);
    const state = node.fork ? node.fork.state : "root";
    const group = make("g", { "data-id": id, style: "cursor: pointer", opacity: isDimmed(node) ? 0.25 : 1 }, nodeLayer);
    make("title", {}, group).textContent = node.fork ? `${node.fork.label} · ${node.fork.topic}` : node.title;
    rects.set(id, make("rect", {
      x: p.cx - NODE_W / 2, y: top(p), width: NODE_W, height: NODE_H, rx: 10,
      fill: { root: css("--root"), returned: css("--returned"), "not-returned": css("--open"), draft: css("--panel") }[state],
    }, group));
    const lines = SessionTreeLayout.wrapText(displayLabel(node), state === "root" ? 22 : 25, 3);
    const text = make("text", { "text-anchor": "middle", "font-size": state === "root" ? 13 : 12, "font-weight": state === "root" ? 600 : 400, fill: state === "draft" ? css("--text") : "#fff" }, group);
    lines.forEach((line, i) => {
      make("tspan", { x: p.cx, y: p.cy + 4 + (i - (lines.length - 1) / 2) * 15 }, text).textContent = line;
    });
    if (folded.has(id)) {
      const badge = make("g", {}, group);
      make("rect", { x: p.cx + NODE_W / 2 - 38, y: p.cy + NODE_H / 2 - 11, width: 42, height: 20, rx: 10, fill: css("--panel"), stroke: css("--text"), "stroke-width": 1.5 }, badge);
      make("text", { x: p.cx + NODE_W / 2 - 17, y: p.cy + NODE_H / 2 + 3, "text-anchor": "middle", "font-size": 11, fill: css("--text") }, badge)
        .textContent = `+${SessionTreeLayout.descendantCount(childrenOf, id)}`;
    }
  }
  paintSelection();
}

function fitView() {
  const bounds = SessionTreeLayout.boundsOf(positions, NODE_W, NODE_H);
  if (!bounds) return;
  const width = svg.clientWidth, height = svg.clientHeight, pad = 40;
  const k = Math.min((width - pad * 2) / bounds.w, (height - pad * 2) / bounds.h, 1.3);
  view = { k, x: (width - bounds.w * k) / 2 - bounds.x * k, y: Math.max(pad, (height - bounds.h * k) / 2) - bounds.y * k };
  applyView();
}

function applyFilters() {
  positions = SessionTreeLayout.computeLayout({ roots: currentRoots(), childrenOf, folded, nodeWidth: NODE_W, nodeHeight: NODE_H, gapX: GAP_X, gapY: GAP_Y });
  draw();
  fitView();
}

function selectNode(id) {
  selected = id;
  paintSelection();
  showDetails(id);
}

// Pan with the pointer, zoom with the wheel, select with a click, fold a branch with a double click.
let drag = null;
svg.addEventListener("pointerdown", (event) => {
  const hit = event.target.closest("[data-id]");
  drag = { x: event.clientX, y: event.clientY, originX: view.x, originY: view.y, moved: false, id: hit ? hit.dataset.id : null };
});
svg.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; svg.setPointerCapture(event.pointerId); svg.style.cursor = "grabbing"; }
  if (drag.moved) { view.x = drag.originX + dx; view.y = drag.originY + dy; applyView(); }
});
const endDrag = (event) => {
  const finished = drag;
  drag = null;
  svg.style.cursor = "";
  if (finished && !finished.moved && finished.id && event.type === "pointerup") selectNode(finished.id);
};
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);
svg.addEventListener("dblclick", (event) => {
  const hit = event.target.closest("[data-id]");
  if (!hit || !(childrenOf.get(hit.dataset.id) || []).length) return;
  if (!folded.delete(hit.dataset.id)) folded.add(hit.dataset.id);
  applyFilters();
});
svg.addEventListener("wheel", (event) => {
  event.preventDefault();
  const rect = svg.getBoundingClientRect();
  const x = event.clientX - rect.left, y = event.clientY - rect.top;
  const k = Math.min(2.5, Math.max(0.2, view.k * Math.exp(-event.deltaY * 0.0015)));
  view = { x: x - (x - view.x) * (k / view.k), y: y - (y - view.y) * (k / view.k), k };
  applyView();
}, { passive: false });

function copyButton(text, label) {
  return `<button data-copy="${escapeHtml(text)}">${escapeHtml(label)}</button>`;
}

function showDetails(id) {
  const node = nodesById.get(id);
  const panel = document.getElementById("details");
  const forks = DATA.edges.filter((edge) => edge.kind === "fork" && edge.source === id).map((edge) => nodesById.get(edge.target));
  const parent = parentOf.has(id) ? nodesById.get(parentOf.get(id)) : null;
  const parts = [];

  if (node.fork) {
    const f = node.fork;
    parts.push(`<h2>${escapeHtml(f.topic)}</h2>`);
    parts.push(`<div><span class="badge" style="--c: var(${STATE_COLOR[f.state]})">${STATE_TEXT[f.state]}</span><span class="dev">${escapeHtml(f.label)} · fork of “${escapeHtml(parent ? parent.title : "")}”</span></div>`);
    parts.push(`<h3>Timeline</h3><dl class="facts">
      <dt>Created</dt><dd>${formatDate(f.createdAt)}</dd>
      <dt>Started</dt><dd>${f.launchedAt ? formatDate(f.launchedAt) : '<span class="empty">not started</span>'}</dd>
      <dt>Returned</dt><dd>${f.returnedAt ? formatDate(f.returnedAt) : '<span class="empty">not returned</span>'}</dd>
      <dt>Delivered</dt><dd>${f.deliveredAt ? formatDate(f.deliveredAt) : f.returnedAt ? '<span class="empty">with the next message in the parent</span>' : "—"}</dd>
    </dl>`);
    parts.push(`<h3>Result sent back</h3>${f.result ? `<div class="doc">${markdown(f.result)}</div>` : '<p class="empty">No result yet.</p>'}`);
    parts.push(`<h3>Brief from the parent</h3>${f.brief ? `<div class="doc">${markdown(f.brief)}</div>` : '<p class="empty">No brief.</p>'}`);
  } else {
    parts.push(`<h2>${escapeHtml(node.title)}</h2><div class="dev">Main conversation · ${escapeHtml(projectName(node.cwd))}</div>`);
  }

  if (forks.length) {
    parts.push(`<h3>Forks (${forks.length})</h3><ul>${forks.map((child) => `<li><a href="#" data-select="${escapeHtml(child.id)}">${escapeHtml(child.fork.label)} ${escapeHtml(child.fork.topic)}</a> — ${STATE_TEXT[child.fork.state].toLowerCase()}</li>`).join("")}</ul>`);
  }

  parts.push(`<h3>For developers</h3><dl class="facts dev">
    <dt>Session</dt><dd>${escapeHtml(node.id)}</dd>
    <dt>Project</dt><dd>${escapeHtml(node.cwd || "")}</dd>
    <dt>Transcript</dt><dd>${escapeHtml(node.transcript || "not found")}</dd>
    ${node.fork ? `<dt>Brief file</dt><dd>${escapeHtml(node.fork.briefPath)}</dd><dt>Result file</dt><dd>${escapeHtml(node.fork.resultPath)}</dd>` : ""}
  </dl>
  <div class="actions">
    ${copyButton(`claude --resume ${node.id}`, "Copy resume command")}
    ${node.transcript ? copyButton(node.transcript, "Copy transcript path") : ""}
    ${node.fork && node.fork.result ? copyButton(node.fork.result, "Copy result") : ""}
  </div>`);

  panel.innerHTML = parts.join("\n");
}

document.getElementById("details").addEventListener("click", (event) => {
  const copy = event.target.closest("[data-copy]");
  if (copy) {
    navigator.clipboard.writeText(copy.dataset.copy).then(() => {
      const original = copy.textContent;
      copy.textContent = "Copied";
      setTimeout(() => (copy.textContent = original), 1200);
    });
  }
  const select = event.target.closest("[data-select]");
  if (select) {
    event.preventDefault();
    selectNode(select.dataset.select);
  }
});

const projects = [...new Set(DATA.nodes.filter((node) => !parentOf.has(node.id)).map((node) => node.cwd || ""))].sort();
const projectSelect = document.getElementById("project");
projectSelect.innerHTML = `<option value="">All projects (${projects.length})</option>` +
  projects.map((cwd) => `<option value="${escapeHtml(cwd)}">${escapeHtml(projectName(cwd))}</option>`).join("");
for (const id of ["project", "state"]) document.getElementById(id).addEventListener("change", applyFilters);
document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("fit").addEventListener("click", () => fitView());

const forkCount = DATA.nodes.filter((node) => node.fork).length;
document.getElementById("meta").textContent =
  `${forkCount} fork${forkCount === 1 ? "" : "s"} · updated ${formatDate(DATA.generatedAt)}`;

if (!DATA.nodes.length) {
  document.getElementById("details").innerHTML = '<p class="placeholder">No forks yet. Run /tree:fork in a Claude Code session to create one.</p>';
}
applyFilters();

const initial = new URLSearchParams(location.hash.slice(1)).get("select");
if (initial && nodesById.has(initial)) {
  selectNode(initial);
}
</script>
</body>
</html>
